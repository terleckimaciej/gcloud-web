name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest

  # Single required status check for branch protection: green only if every
  # job above passed. New checks (lint, etc.) are added to `needs`.
  ci:
    if: always()
    needs: [pytest]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pytest.result }}" = success
